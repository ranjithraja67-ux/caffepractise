<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=  , initial-scale=1.0">
    <title>CaT-CaFe</title>
    <link rel="stylesheet" href="./res.css">

</head>

<body>
    <div id="res-header">
        <div class="res-img">
            <img src="./icons8-coffee-shop-64.png" alt="img" height="50px" width="50px">
            <h1>CaT CaFe</h1>
        </div>
        <div class="prod-page">
            <a href="">About</a>
            <a href="">Produts</a>
            <a href="">Working Hours</a>
            <a href="">Services</a>
        </div>
        <div class="menu-img">
            <img src="./icons8-menu-100 (1).png" alt="menuimg" height="40px" width="40px">
        </div>
    </div>
    <div class="coffee-quote">
        <img src="./coffee quote.avif" alt=" cafe quote" height="500px" width="50%">
    </div>
    <div id="listofitem">
        <div class="img1">
            <img src="./capucino.webp" alt="capucino" height="250px" width="350px">
            <div class="item-info">
                <h1>CAPUCINO</h1>
                <button class="btn">Order</button>
            </div>
        </div>
        <div class="img2">
            <img src="./bubble coffee.jpg" alt="capucino" height="250px" width="350px">
            <h1>BABOA COFFEE</h1>
        </div>
        <div class="img3">
            <img src="./coffee ice.webp" alt="capucino" height="250px" width="350px">
            <h1>COFFEE-ICE CREAM</h1>
        </div>
        <div class="img4">
            <img src="./cold coffee.jpg" alt="capucino" height="250px" width="350px">
            <h1>COLD COFFEE</h1>
        </div>
        <div class="img5">
            <img src="./choco caffe.png" alt="capucino" height="250px" width="350px">
            <h1>CHOCOLATE COFFEE</h1>
        </div>
        <div class="img6">
            <img src="./blk coffee.avif" alt="capucino" height="250px" width="350px">
            <h1>BLACK COFFEE</h1>
        </div>
    </div>
</body>

</html>
